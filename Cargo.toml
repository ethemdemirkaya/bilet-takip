[package]
name = "bilet-takip"
version = "0.1.0"
edition = "2021"
description = "Kayseri etkinlik bilet fiyatlarını izler, fiyat düşünce Telegram'dan haber verir."
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "json", "cookies"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
